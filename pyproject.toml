[project]
name = "star-cover"
version = "0.1.0"
description = "Generates a star (ch)art for report cover pages"
authors = ["Alex Muirhead <alexandermuirhead@hotmail.com>"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.4",
    "skyfield>=1.48",
    "svgwrite>=1.4.3",
    "timezonefinder>=6.5.0",
    "pytz>=2024.1",
    "pyyaml>=6.0.1",
    "tomlkit>=0.12.4",
    "pandas>=2.2.2",
    "papersize>=1.5.0",
    "pydantic>=2.7.1",
]
